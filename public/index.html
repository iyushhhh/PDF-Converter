<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File to PDF Converter</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.output.css">
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">
  <div class="max-w-4xl mx-auto p-6">
    <!-- Header -->
    <div class="flex items-center justify-between mb-8">
      <h1 class="text-4xl font-bold tracking-tight">📄 File → PDF</h1>
      <div class="text-sm text-zinc-400">Images + TXT + DOCX</div>
    </div>

    <!-- Drag & Drop -->
    <div id="dropZone"
         class="border-2 border-dashed border-zinc-700 rounded-3xl p-12 text-center hover:border-blue-500 transition-all cursor-pointer">
      <div class="mx-auto w-16 h-16 bg-zinc-800 rounded-2xl flex items-center justify-center mb-4">
        📤
      </div>
      <p class="text-xl font-medium mb-2">Drop files here</p>
      <p class="text-zinc-400 mb-6">or</p>
      <label class="bg-blue-600 hover:bg-blue-700 px-8 py-3 rounded-2xl cursor-pointer transition">
        Select Files
        <input type="file" id="fileInput" multiple accept=".jpg,.jpeg,.png,.txt,.docx" class="hidden">
      </label>
      <p class="text-xs text-zinc-500 mt-4">JPG, PNG, TXT, DOCX • Max 10MB each</p>
    </div>

    <!-- Uploaded Files -->
    <div id="fileList" class="mt-8 hidden">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-semibold">Uploaded Files</h2>
        <button id="clearAll" class="text-red-400 hover:text-red-500 text-sm">Clear All</button>
      </div>
      <div id="filesContainer" class="grid grid-cols-2 md:grid-cols-3 gap-4"></div>
    </div>

    <!-- Action Buttons -->
    <div class="mt-8 flex gap-4">
      <button id="convertBtn"
              class="flex-1 bg-emerald-600 hover:bg-emerald-700 disabled:bg-zinc-700 py-4 rounded-3xl font-semibold text-lg flex items-center justify-center gap-2 transition">
        <span id="convertText">Convert to PDF</span>
        <span id="spinner" class="hidden animate-spin">⟳</span>
      </button>
    </div>

    <!-- Result -->
    <div id="resultSection" class="hidden mt-8 text-center">
      <div class="bg-zinc-900 rounded-3xl p-8">
        <p class="text-emerald-400 text-xl mb-4">✅ PDF Ready!</p>
        <button id="downloadBtn"
                class="bg-white text-zinc-950 px-10 py-4 rounded-3xl font-bold text-lg hover:scale-105 transition">
          Download PDF
        </button>
      </div>
    </div>

    <!-- Error -->
    <div id="errorMsg" class="hidden mt-4 text-red-400 text-center"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
